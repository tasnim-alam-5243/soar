openapi: 3.0.3
info:
  title: SOAR Platform API
  version: 0.2.0
  description: |
    REST API of the SOAR platform (spec section 11). This file is the source of truth:
    change it first, then the code. Contract tests fail when a route and this document disagree.

    **Authentication:** every operation except this document needs `Authorization: Bearer <token>`,
    an OIDC access token from Keycloak or an API key (`soar_...`). Permissions follow the caller's
    roles (admin, engineer, analyst, viewer, service; see GET /roles). Missing or invalid credentials
    give 401, missing permissions 403. Every successful mutation is written to the audit log.

    Conventions: JSON bodies; timestamps are RFC 3339 UTC; cursor pagination (`limit` 1-200,
    `cursor` from the previous page's `next_cursor`); errors are RFC 9457 `application/problem+json`;
    `Idempotency-Key` on creates; `ETag` on single resources and optional `If-Match` on updates
    (409 on mismatch); `X-Request-ID` on every response.
security:
  - bearer: []
servers:
  - url: /api/v1
paths:
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This document
      responses:
        '200': { description: OpenAPI document, content: { application/yaml: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Problem' }

  /workflows:
    post:
      operationId: createWorkflow
      summary: Create a workflow (version 1, draft)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/WorkflowCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listWorkflows
      summary: List workflow versions
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, name, -name, version, -version] } }
        - { name: name, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: A page of workflows, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /workflows/validate:
    post:
      operationId: validateWorkflow
      summary: Check a workflow definition without saving it
      description: Structural checks now; CEL and parameter checks arrive with the engine (Step 6).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ValidateRequest' } } } }
      responses:
        '200': { description: Validation result, content: { application/json: { schema: { $ref: '#/components/schemas/ValidateResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /workflows/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getWorkflow
      summary: Get one workflow version
      responses:
        '200': { $ref: '#/components/responses/WorkflowOK' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateWorkflow
      summary: Replace a draft version (published versions are immutable)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowCreate' } } } }
      responses:
        '200': { $ref: '#/components/responses/WorkflowOK' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /workflows/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: createWorkflowVersion
      summary: Create the next draft version (copies this one; send {} to copy unchanged)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowVersionCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/WorkflowCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /workflows/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: publishWorkflow
      summary: Validate and publish a draft; it becomes immutable
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/WorkflowOK' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /workflows/{id}/run:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: runWorkflow
      summary: Start an execution (published versions; drafts only with dry_run)
      description: |
        Creates a queued execution and hands it to the orchestrator. The response is 202: the
        execution runs asynchronously; follow it with GET /executions/{id} or GET /stream.
        With dry_run, write and destructive actions that support it only report what they would do,
        and those that do not are skipped.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/RunRequest' } } } }
      responses:
        '202': { $ref: '#/components/responses/ExecutionAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me:
    get:
      operationId: getMe
      summary: The authenticated caller, its roles and permissions
      responses:
        '200': { description: The caller, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /dashboard:
    get:
      operationId: getDashboard
      summary: Dashboard figures (alert volume, open cases, MTTR, automation rate, queue and source health)
      description: |
        Without `range` the response carries the fixed 24-hour figures only. With `range` it also
        carries a `range` section: time series, top-5 lists and each figure for the previous period
        of the same length. There is no 30-day range because retention keeps 7 days.
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 24h, 7d] } }
      responses:
        '200': { description: The figures, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /stream:
    get:
      operationId: streamEvents
      summary: Server-sent events for execution, case, approval and alert changes
      description: |
        Each event is `event: <topic>` with a JSON `UIEvent` as data. Browsers (EventSource) cannot
        send headers, so the access token may be passed as `access_token` instead.
      parameters:
        - { name: topics, in: query, description: comma-separated topics (default all), schema: { type: string } }
        - { name: access_token, in: query, schema: { type: string } }
      responses:
        '200': { description: An endless event stream, content: { text/event-stream: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Problem' }

  /executions:
    get:
      operationId: listExecutions
      summary: List executions
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, started_at, -started_at, ended_at, -ended_at] } }
        - { name: workflow_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: alert_id, in: query, schema: { type: string } }
      responses:
        '200': { description: A page of executions, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /executions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getExecution
      summary: Get one execution
      responses:
        '200': { description: The execution, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Execution' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /executions/{id}/steps:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: listExecutionSteps
      summary: Step runs of an execution, oldest first
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at] } }
      responses:
        '200': { description: A page of step runs, content: { application/json: { schema: { $ref: '#/components/schemas/StepRunPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /executions/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: cancelExecution
      summary: Ask the orchestrator to cancel a running or waiting execution
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/CancelRequest' } } } }
      responses:
        '202': { description: Cancel requested, content: { application/json: { schema: { $ref: '#/components/schemas/Execution' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /executions/{id}/retry:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: retryExecution
      summary: Start a new execution with the same workflow version, inputs and alert
      responses:
        '202': { $ref: '#/components/responses/ExecutionAccepted' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /approvals:
    get:
      operationId: listApprovals
      summary: Human decisions requested by approval nodes and by policy
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, due_at, -due_at] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: execution_id, in: query, schema: { type: string } }
        - { name: workflow_id, in: query, schema: { type: string } }
      responses:
        '200': { description: A page of approvals, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /approvals/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getApproval
      summary: Get one approval
      responses:
        '200': { description: The approval, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /approvals/{id}/decision:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: decideApproval
      summary: Approve or reject (analysts and above, or a named approver)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
      responses:
        '200': { description: The decided approval, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /alerts:
    get:
      operationId: listAlerts
      summary: Search alerts, newest first
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: [received_at, -received_at, severity, -severity, occurrence_count, -occurrence_count, last_seen, -last_seen] } }
        - { name: source_id, in: query, schema: { type: string } }
        - { name: system, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: 'comma-separated; "new" also matches alerts that have no status yet' }
        - { name: verdict, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string }, description: Exact severity, comma-separated for several }
        - { name: min_severity, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: case_id, in: query, schema: { type: string } }
        - { name: assignee, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: 'Free text over title, description, observables, hosts, users and tags (all words must match)' }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: A page of alerts, content: { application/json: { schema: { $ref: '#/components/schemas/AlertPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAlert
      summary: Record an alert by hand (monitored systems use the ingestion pipeline)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertCreate' } } } }
      responses:
        '201': { description: Created, headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /alerts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getAlert
      summary: Get one alert
      responses:
        '200': { description: The alert, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: patchAlert
      summary: Triage an alert (status, verdict, assignee; absent fields stay as they are)
      description: Closing an alert needs a verdict, given in the same request or already on the alert.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertPatch' } } } }
      responses:
        '200': { description: The updated alert, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /assignees:
    get:
      operationId: listAssignees
      summary: Names to offer when assigning alerts and cases
      description: |
        The assignees already used on cases and alerts plus the enabled user principals, sorted.
        Needs alerts:write (every role that can assign holds it). OIDC users are not principals,
        so they appear once they have been assigned something.
      responses:
        '200': { description: The names, content: { application/json: { schema: { $ref: '#/components/schemas/Assignees' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /alerts/{id}/case:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: alertToCase
      summary: Link the alert to a case, or open a new case from it (201 when created)
      description: The alert is copied into the case (it outlives the alert's retention) and its observables are linked to the case.
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/AlertToCase' } } } }
      responses:
        '200': { $ref: '#/components/responses/CaseLinked' }
        '201': { $ref: '#/components/responses/CaseLinked' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cases:
    post:
      operationId: createCase
      summary: Open a case
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseCreate' } } } }
      responses:
        '201': { description: Created, headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCases
      summary: List cases, newest first
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, updated_at, -updated_at, severity, -severity, title, -title] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: assignee, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: verdict, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Free text over title, summary and tags (all words must match) }
      responses:
        '200': { description: A page of cases, content: { application/json: { schema: { $ref: '#/components/schemas/CasePage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cases/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getCase
      summary: Get one case
      responses:
        '200': { description: The case, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: patchCase
      summary: Change some fields of a case (absent fields stay as they are)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CasePatch' } } } }
      responses:
        '200': { description: The updated case, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cases/{id}/tasks:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: createCaseTask
      summary: Add a task to a case
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseTaskCreate' } } } }
      responses:
        '201': { description: Created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/CaseTask' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCaseTasks
      summary: Tasks of a case, oldest first
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at] } }
      responses:
        '200': { description: A page of tasks, content: { application/json: { schema: { $ref: '#/components/schemas/CaseTaskPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cases/{id}/tasks/{task_id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: task_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    patch:
      operationId: patchCaseTask
      summary: Update a task (status, assignee, due date)
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseTaskPatch' } } } }
      responses:
        '200': { description: Updated, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/CaseTask' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cases/{id}/alerts:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: linkCaseAlerts
      summary: Link alerts to the case (each is copied into soar-case-alerts)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaseAlertsLink' } } } }
      responses:
        '200': { description: The case, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCaseAlerts
