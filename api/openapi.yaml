        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /roles:
    get:
      operationId: listRoles
      summary: Roles and their permissions
      responses:
        '200': { description: All roles, content: { application/json: { schema: { $ref: '#/components/schemas/RolePage' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /audit:
    get:
      operationId: listAudit
      summary: Audit log (every mutation and secret write)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at] } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: A page of audit records, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An OIDC access token from Keycloak, or an API key (soar_...).
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, description: next_cursor of the previous page, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Repeats of a create with the same key return the original resource instead of creating another.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
    IfMatch:
      name: If-Match
      in: header
      description: ETag from a previous response. If the resource changed since, the update fails with 409.
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    WorkflowOK:
      description: The workflow version
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } }
    WorkflowCreated:
      description: Created
      headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } }
    CaseLinked:
      description: The case the alert is linked to
      headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } }
    ExecutionAccepted:
      description: Execution queued
      headers: { Location: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Execution' } } }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id: { type: string }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
    FieldError:
      type: object
      required: [path, message]
      properties: { path: { type: string }, message: { type: string } }

    Meta:
      type: object
      required: [id, created_at, updated_at, schema_version]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        schema_version: { type: integer }

    Trigger:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [alert, schedule, manual, event] }
        kind: { type: string }
        match: { type: string, description: CEL condition }
        cron: { type: string, description: 'schedule triggers: 5-field cron (UTC), @hourly, @daily, @every 15m' }
    Workflow:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [name, version, status, definition]
          properties:
            name: { type: string }
            description: { type: string }
            version: { type: integer, minimum: 1 }
            status: { type: string, enum: [draft, published, archived] }
            definition: { type: object, additionalProperties: true }
            triggers: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
            checksum: { type: string }
            created_by: { type: string }
    WorkflowCreate:
      type: object
      required: [name, definition]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        definition: { type: object, additionalProperties: true }
        triggers: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
    WorkflowVersionCreate:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 2000 }
        definition: { type: object, additionalProperties: true }
        triggers: { type: array, items: { $ref: '#/components/schemas/Trigger' } }
    ValidateRequest:
      type: object
      required: [definition]
      additionalProperties: false
      properties: { definition: { type: object, additionalProperties: true } }
    ValidateResult:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
    WorkflowPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
        next_cursor: { type: string }

    Execution:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [workflow_id, workflow_version, status, trigger, partition]
          properties:
            workflow_id: { type: string }
            workflow_name: { type: string }
            workflow_version: { type: integer }
            workflow_checksum: { type: string }
            status: { type: string, enum: [queued, running, waiting, succeeded, failed, cancelled, timed_out] }
            trigger:
              type: object
              required: [type]
              properties:
                type: { type: string }
                kind: { type: string }
                alert_id: { type: string }
                event_id: { type: string }
                user: { type: string }
                parent_execution_id: { type: string }
                parent_node_id: { type: string }
                retry_of: { type: string }
                scheduled_for: { type: string, format: date-time }
            context: { type: object, additionalProperties: true, description: 'engine state: inputs, vars, per-node status, attempts and outputs' }
            pending_nodes: { type: array, items: { type: string } }
            outbox: { type: array, items: { type: object, additionalProperties: true } }
            outbox_pending: { type: boolean }
            lease: { type: object, additionalProperties: true }
            partition: { type: integer }
            dry_run: { type: boolean }
            error: { type: string }
            started_at: { type: string, format: date-time }
            ended_at: { type: string, format: date-time }
            deadline_at: { type: string, format: date-time }
    ExecutionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Execution' } }
        next_cursor: { type: string }
    StepRun:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [execution_id, node_id, attempt, status]
          properties:
            execution_id: { type: string }
            workflow_id: { type: string }
            node_id: { type: string }
            action: { type: string }
            attempt: { type: integer }
            item: { type: integer }
            status: { type: string }
            input: { type: object, additionalProperties: true, description: '{"value": params} with secrets redacted' }
            output: { type: object, additionalProperties: true, description: '{"value": output}' }
            dry_run: { type: boolean }
            started_at: { type: string, format: date-time }
            ended_at: { type: string, format: date-time }
            input_ref: { type: string }
            output_ref: { type: string }
            error: { type: object, additionalProperties: true }
            duration_ms: { type: integer }
            idempotency_key: { type: string }
            parent_step_id: { type: string }
            actor_type: { type: string }
    StepRunPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StepRun' } }
        next_cursor: { type: string }

    ObservableRef:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type: { type: string, enum: [ip, domain, url, hash, email, host, user, file_path] }
        value: { type: string, minLength: 1, maxLength: 2048 }
        role: { type: string }
    Alert:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [kind, source_id, title, severity, received_at, occurrence_count]
          properties:
            event_id: { type: string }
            kind: { type: string }
            source_id: { type: string }
            system: { type: string }
            external_id: { type: string }
            external_url: { type: string }
            fingerprint: { type: string }
            title: { type: string }
            description: { type: string }
            summary: { type: string }
            severity: { type: integer, minimum: 1, maximum: 5 }
            original_severity: { type: string }
            status: { type: string }
            category: { type: string }
            tags: { type: array, items: { type: string } }
            observables: { type: array, items: { $ref: '#/components/schemas/ObservableRef' } }
            entities: { type: object, additionalProperties: true }
            mitre: { type: object, properties: { technique_ids: { type: array, items: { type: string } }, techniques: { type: array, items: { type: string } }, tactics: { type: array, items: { type: string } } } }
            verdict: { type: string }
            assignee: { type: string }
            ext: { type: object, additionalProperties: true }
            raw_ref: { type: string }
            occurred_at: { type: string, format: date-time }
            received_at: { type: string, format: date-time }
            last_seen: { type: string, format: date-time }
            occurrence_count: { type: integer }
            case_id: { type: string }
    AlertPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: string, enum: [new, acknowledged, in_progress, closed] }
        verdict: { type: string, enum: ['', true_positive, false_positive, benign, unknown] }
        assignee: { type: string, maxLength: 200 }
    Assignees:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: string } }
    AlertCreate:
      type: object
      required: [title, severity]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string }
        severity: { type: integer, minimum: 1, maximum: 5 }
        kind: { type: string, enum: [alert, case_event, indicator, asset, custom] }
        source_id: { type: string }
        external_id: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        observables: { type: array, items: { $ref: '#/components/schemas/ObservableRef' } }
        mitre: { type: object, additionalProperties: true }
        ext: { type: object, additionalProperties: true }
    AlertPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Alert' } }
        next_cursor: { type: string }

    Case:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [title, status, severity]
          properties:
            title: { type: string }
            summary: { type: string }
            status: { type: string, enum: [open, in_progress, closed] }
            severity: { type: integer, minimum: 1, maximum: 5 }
            assignee: { type: string }
            sla: { type: object, additionalProperties: true }
            alert_ids: { type: array, items: { type: string } }
            tags: { type: array, items: { type: string } }
            verdict: { type: string, enum: ['', true_positive, false_positive, benign, unknown] }
            external_refs: { type: array, items: { type: object, required: [system, id], properties: { system: { type: string }, id: { type: string }, url: { type: string }, last_synced_at: { type: string, format: date-time }, sync_version: { type: integer } } } }
            closed_at: { type: string, format: date-time }
            evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
    CaseCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        summary: { type: string }
        severity: { type: integer, minimum: 1, maximum: 5, default: 3 }
        assignee: { type: string }
        tags: { type: array, items: { type: string } }
        alert_ids: { type: array, maxItems: 200, items: { type: string }, description: Alerts to link right away }
    CasePatch:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        summary: { type: string }
        status: { type: string, enum: [open, in_progress, closed] }
        severity: { type: integer, minimum: 1, maximum: 5 }
        assignee: { type: string }
        tags: { type: array, items: { type: string } }
        verdict: { type: string, enum: ['', true_positive, false_positive, benign, unknown] }
    CasePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Case' } }
        next_cursor: { type: string }
    CaseTask:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [case_id, title, status]
          properties:
            case_id: { type: string }
            title: { type: string }
            description: { type: string }
            status: { type: string }
            assignee: { type: string }
            due_at: { type: string, format: date-time }
    CaseTaskCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string }
        assignee: { type: string }
        due_at: { type: string, format: date-time }
    CaseTaskPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CaseTask' } }
        next_cursor: { type: string }
    CaseObservableCreate:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type: { type: string, enum: [ip, domain, url, hash, email, host, user, file_path] }
        value: { type: string, minLength: 1, maxLength: 2048 }
    Observable:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [type, value, first_seen, last_seen]
          properties:
            type: { type: string }
            value: { type: string }
            first_seen: { type: string, format: date-time }
            last_seen: { type: string, format: date-time }
            reputation: { type: object, additionalProperties: true }
            case_ids: { type: array, items: { type: string } }
    ObservablePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Observable' } }
        next_cursor: { type: string }
    TimelineEvent:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [subject_id, event_type]
          properties:
            subject_id: { type: string }
            event_type: { type: string }
            actor: { type: string }
            data: { type: object, additionalProperties: true }
    TimelinePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
        next_cursor: { type: string }

    Connection:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [connector_id, name, auth_type]
          properties:
            connector_id: { type: string }
            name: { type: string }
            auth_type: { type: string }
            secret_refs: { type: object, additionalProperties: true }
            config: { type: object, additionalProperties: true }
    ConnectionCreate:
      type: object
      required: [connector_id, name, auth_type]
      additionalProperties: false
      properties:
        connector_id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 200 }
        auth_type: { type: string, enum: [none, api_key, basic, bearer, oauth2_client_credentials] }
        secret_refs: { type: object, additionalProperties: true, description: Map of credential name to the NAME of a stored secret. Never the secret itself. }
        config: { type: object, additionalProperties: true }
    ConnectionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        next_cursor: { type: string }

    Source:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [name, adapter, parser, mapping_id, enabled]
          properties:
            name: { type: string }
            system: { type: string }
            adapter: { type: string }
            parser: { type: string }
            mapping_id: { type: string, description: 'name@version' }
            filters: { type: array, items: { type: string } }
            auth: { type: object, additionalProperties: true }
            schedule: { type: string }
            dedup: { type: object, additionalProperties: true }
            rate_limit: { type: object, additionalProperties: true }
            config: { type: object, additionalProperties: true }
            enabled: { type: boolean }
            health: { type: object, properties: { status: { type: string }, last_event_at: { type: string, format: date-time }, rate_per_sec: { type: number }, error_rate: { type: number }, lag_seconds: { type: number } } }
    SourceCreate:
      type: object
      required: [name, adapter, parser, mapping]
      additionalProperties: false
      properties:
        name: { type: string }
        system: { type: string }
        adapter: { type: string }
        parser: { type: string }
        mapping: { type: string, description: 'name@version' }
        filters: { type: array, items: { type: string } }
        auth: { type: object, additionalProperties: true }
        schedule: { type: string }
        dedup: { type: object, additionalProperties: true }
        rate_limit: { type: object, additionalProperties: true }
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }
    SourcePatch:
      type: object
      additionalProperties: false
      properties:
        system: { type: string }
        mapping: { type: string }
        filters: { type: array, items: { type: string } }
        auth: { type: object, additionalProperties: true }
        schedule: { type: string }
        dedup: { type: object, additionalProperties: true }
        rate_limit: { type: object, additionalProperties: true }
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }
    SourcePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Source' } }
        next_cursor: { type: string }
    SourceTestRequest:
      type: object
      required: [payload]
      additionalProperties: false
      properties:
        payload: { description: A JSON value, or a string for text formats such as ndjson }
    SourceTestResult:
      type: object
      required: [events, filtered, failures, rules_fired]
      properties:
        events: { type: array, items: { type: object, additionalProperties: true } }
        filtered: { type: integer }
        failures:
          type: array
          items:
            type: object
            required: [stage, error]
            properties: { stage: { type: string }, error: { type: string } }
        rules_fired: { type: object, additionalProperties: true }
    SourceHealth:
      type: object
      required: [source, enabled]
      properties:
        source: { type: string }
        enabled: { type: boolean }
        health: { type: object, additionalProperties: true }

    Mapping:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [name, version, kind, definition]
          properties:
            name: { type: string }
            version: { type: integer, minimum: 1 }
            kind: { type: string }
            definition: { type: object, additionalProperties: true }
            checksum: { type: string }
    MappingCreate:
      type: object
      required: [name, definition]
      additionalProperties: false
      properties:
        name: { type: string }
        kind: { type: string }
        definition: { type: object, additionalProperties: true }
    MappingPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Mapping' } }
        next_cursor: { type: string }
    MappingTestRequest:
      type: object
      required: [sample]
      additionalProperties: false
      properties:
        mapping: { type: string, description: 'name@version of a stored mapping' }
        definition: { type: object, additionalProperties: true, description: An unsaved mapping to try }
        sample: { type: object, additionalProperties: true }
    MappingTestResult:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        alert: { type: object, additionalProperties: true }
        dedup_key: { type: array, items: { type: string } }
        error:
          type: object
          required: [message]
          properties: { field: { type: string }, expr: { type: string }, message: { type: string } }

    FilterSet:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [name, version, mode, default, rules]
          properties:
            name: { type: string }
            version: { type: integer, minimum: 1 }
            mode: { type: string, enum: [first_match, all] }
            default: { type: string, enum: [keep, drop] }
            rules: { type: array, items: { type: object, additionalProperties: true } }
            checksum: { type: string }
    FilterCreate:
      type: object
      required: [name, rules]
      additionalProperties: false
      properties:
        name: { type: string }
        mode: { type: string, enum: [first_match, all] }
        default: { type: string, enum: [keep, drop] }
        rules: { type: array, items: { type: object, additionalProperties: true } }
    FilterPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FilterSet' } }
        next_cursor: { type: string }
    FilterTestRequest:
      type: object
      required: [sample]
      additionalProperties: false
      properties:
        filter_set: { type: string, description: 'name@version of a stored filter set' }
        inline: { type: object, additionalProperties: true, description: An unsaved filter set (mode, default, rules) }
        stage: { type: string, enum: [pre_map, post_map] }
        sample: { type: object, additionalProperties: true }
    FilterTestResult:
      type: object
      required: [drop, tags, trace]
      properties:
        drop: { type: boolean }
        rule: { type: string }
        tags: { type: array, items: { type: string } }
        severity: { type: integer }
        route: { type: string }
        trace:
          type: array
          items:
            type: object
            required: [rule, matched]
            properties:
              rule: { type: string }
              matched: { type: boolean }
              action: { type: string }
              error: { type: string }

    ManagedList:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [name, items]
          properties:
            name: { type: string }
            items: { type: array, items: { type: string } }
    ManagedListPut:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { type: string, minLength: 1, maxLength: 512 }, maxItems: 100000 }
    ListPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManagedList' } }
        next_cursor: { type: string }

    DeadLetter:
      type: object
      required: [seq, subject, origin_subject, reason, stored_at, size]
      properties:
        seq: { type: integer }
        subject: { type: string }
        origin_subject: { type: string }
        reason: { type: string }
        deliveries: { type: integer }
        stored_at: { type: string, format: date-time }
        size: { type: integer }
    DeadLetterPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DeadLetter' } }
        next_cursor: { type: string }
    ReplayResult:
      type: object
      required: [replayed]
      properties: { replayed: { type: integer } }
    QueueStats:
      type: object
      required: [streams, at]
      properties:
        at: { type: string, format: date-time }
        streams:
          type: array
          items:
            type: object
            required: [name, messages, bytes, max_bytes]
            properties:
              name: { type: string }
              messages: { type: integer }
              bytes: { type: integer }
              max_bytes: { type: integer }
              consumers:
                type: array
                items:
                  type: object
                  required: [name, pending, ack_pending, redelivered]
                  properties:
                    name: { type: string }
                    pending: { type: integer }
                    ack_pending: { type: integer }
                    redelivered: { type: integer }

    RunRequest:
      type: object
      additionalProperties: false
      properties:
        inputs: { type: object, additionalProperties: true, description: Workflow inputs; override inputs computed from the alert }
        alert_id: { type: string, description: Run against this alert (available as alert in expressions) }
        dry_run: { type: boolean }
    CancelRequest:
      type: object
      additionalProperties: false
      properties: { reason: { type: string, maxLength: 2000 } }

    Approval:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [execution_id, node_id, approvers, status, due_at]
          properties:
            execution_id: { type: string }
            node_id: { type: string }
            workflow_id: { type: string }
            workflow_name: { type: string }
            partition: { type: integer }
            approvers: { type: array, items: { type: string } }
            message: { type: string }
            action: { type: string, description: set for policy approvals (the held-back action) }
            command: { type: object, additionalProperties: true }
            risk: { type: string }
            status: { type: string, enum: [pending, approved, rejected, expired, cancelled] }
            decided_by: { type: string }
            decided_at: { type: string, format: date-time }
            comment: { type: string }
            due_at: { type: string, format: date-time }
    ApprovalPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        next_cursor: { type: string }
    Decision:
      type: object
      required: [approved]
      additionalProperties: false
      properties:
        approved: { type: boolean }
        comment: { type: string, maxLength: 4000 }

    Connector:
      type: object
      required: [id, actions, builtin]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        version: { type: string }
        auth_type: { type: string }
        connection_schema: { type: object, additionalProperties: true }
        secrets: { type: array, items: { type: string } }
        actions: { type: array, items: { type: string } }
        builtin: { type: boolean }
    ConnectorPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Connector' } } }
    ActionManifest:
      type: object
      required: [id, version, description, side_effect, risk, supports_dry_run, class, at_most_once, limits]
      properties:
        id: { type: string }
        version: { type: integer }
        title: { type: string }
        description: { type: string }
        side_effect: { type: string, enum: [read, write, destructive] }
        risk: { type: string, enum: [low, medium, high] }
        supports_dry_run: { type: boolean }
        class: { type: string, enum: [builtin, python] }
        params_schema: { type: object, additionalProperties: true }
        output_schema: { type: object, additionalProperties: true }
        secrets: { type: array, items: { type: string } }
        retryable_errors: { type: array, items: { type: string } }
        at_most_once: { type: boolean }
        limits: { type: object, additionalProperties: true }
        connector: { type: string }
        entrypoint: { type: string }
        needs_connection: { type: boolean }
        approval_policy: { type: object, additionalProperties: true }
    ActionPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/ActionManifest' } } }

    Secret:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [name, key_id]
          properties:
            name: { type: string }
            key_id: { type: string, description: master key that wraps this secret's data key }
            scope: { type: string }
    SecretPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Secret' } }
        next_cursor: { type: string }
    SecretPut:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { type: string, minLength: 1, maxLength: 65536, writeOnly: true }
        scope: { type: string, maxLength: 200 }

    Principal:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [type, name, roles, disabled]
          properties:
            type: { type: string, enum: [user, api_key, service] }
            name: { type: string }
            roles: { type: array, items: { type: string, enum: [admin, engineer, analyst, viewer, service] } }
            disabled: { type: boolean }
    PrincipalCreated:
      allOf:
        - { $ref: '#/components/schemas/Principal' }
        - type: object
          properties:
            api_key: { type: string, description: 'Shown once. Send as "Authorization: Bearer <api_key>".' }
    PrincipalCreate:
      type: object
      required: [type, name, roles]
      additionalProperties: false
      properties:
        type: { type: string, enum: [user, api_key, service] }
        name: { type: string, minLength: 1, maxLength: 200 }
        roles: { type: array, minItems: 1, items: { type: string, enum: [admin, engineer, analyst, viewer, service] } }
    PrincipalPatch:
      type: object
      additionalProperties: false
      properties:
        roles: { type: array, minItems: 1, items: { type: string, enum: [admin, engineer, analyst, viewer, service] } }
        disabled: { type: boolean }
    PrincipalPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Principal' } }
        next_cursor: { type: string }
    RolePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, permissions]
            properties: { name: { type: string }, permissions: { type: array, items: { type: string } } }
    AuditRecord:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [actor, actor_type, action, resource]
          properties:
            actor: { type: string }
            actor_type: { type: string }
            action: { type: string }
            resource: { type: string }
            before_hash: { type: string }
            after_hash: { type: string }
            ip: { type: string }
            request_id: { type: string }
    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditRecord' } }
        next_cursor: { type: string }
    Me:
      type: object
      required: [id, name, roles, permissions, auth_enabled]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        auth_enabled: { type: boolean }
    UIEvent:
      type: object
      required: [topic, id, at]
      properties:
        topic: { type: string, enum: [executions, cases, approvals, alerts] }
        id: { type: string }
        data: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }

    AlertToCase:
      type: object
      additionalProperties: false
      properties:
        case_id: { type: string, description: Link to this case; omit to open a new case from the alert }
        title: { type: string, maxLength: 300 }
        assignee: { type: string, maxLength: 200 }
    CaseAlertsLink:
      type: object
      required: [alert_ids]
      additionalProperties: false
      properties:
        alert_ids: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
    CaseAlert:
      allOf:
        - { $ref: '#/components/schemas/Meta' }
        - type: object
          required: [case_id, alert_id, snapshot, linked_at]
          properties:
            case_id: { type: string }
            alert_id: { type: string }
            snapshot: { type: object, additionalProperties: true }
            linked_at: { type: string, format: date-time }
    CaseAlertPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CaseAlert' } }
        next_cursor: { type: string }
    CaseTaskPatch:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string }
        status: { type: string, enum: [open, in_progress, done, cancelled] }
        assignee: { type: string, maxLength: 200 }
        due_at: { type: string, format: date-time }
    Evidence:
      type: object
      required: [id, name, ref, sha256, size, added_at]
      properties:
        id: { type: string }
        name: { type: string }
        ref: { type: string }
        sha256: { type: string }
        size: { type: integer }
        content_type: { type: string }
        added_by: { type: string }
        added_at: { type: string, format: date-time }
    EvidenceLink:
      type: object
      required: [url, expires_at, evidence]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
        evidence: { $ref: '#/components/schemas/Evidence' }
    Dashboard:
      type: object
      required: [at, alerts_last_24h, alerts_by_severity, open_cases, cases_by_severity, executions_last_24h, pending_approvals]
      properties:
        at: { type: string, format: date-time }
        alerts_last_24h: { type: integer }
        alerts_by_severity: { type: object, additionalProperties: { type: integer } }
        open_cases: { type: integer }
        cases_by_severity: { type: object, additionalProperties: { type: integer } }
        executions_last_24h: { type: object, additionalProperties: { type: integer } }
        pending_approvals: { type: integer }
        mttr_hours: { type: number, description: mean time to resolve cases closed in the last 7 days }
        automation_rate: { type: number, description: share of the last 24 h's alerts that started a workflow }
        queues: { type: array, items: { type: object, additionalProperties: true } }
        sources: { type: array, items: { type: object, additionalProperties: true } }
        errors: { type: object, additionalProperties: { type: string } }
        range: { $ref: '#/components/schemas/DashboardRange' }
    DashboardRange:
      type: object
      required: [name, from, to, interval_seconds, alerts, alert_series, executions, failed_executions, execution_series, cases_opened, automation_rate, mttr_hours, top_rules, top_sources, top_hosts]
      properties:
        name: { type: string, enum: [1h, 24h, 7d] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        interval_seconds: { type: integer, description: width of each series bucket }
        alerts: { $ref: '#/components/schemas/PeriodCount' }
        alert_series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' }, description: alerts per bucket by severity ("1".."5") }
        executions: { $ref: '#/components/schemas/PeriodCount' }
        failed_executions: { $ref: '#/components/schemas/PeriodCount' }
        execution_series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' }, description: executions per bucket by status }
        cases_opened: { $ref: '#/components/schemas/PeriodCount' }
        automation_rate: { $ref: '#/components/schemas/PeriodFloat' }
        mttr_hours: { $ref: '#/components/schemas/PeriodFloat' }
        top_rules: { type: array, items: { $ref: '#/components/schemas/TermCount' } }
        top_sources: { type: array, items: { $ref: '#/components/schemas/TermCount' } }
        top_hosts: { type: array, items: { $ref: '#/components/schemas/TermCount' } }
    PeriodCount:
      type: object
      required: [current, previous]
      properties:
        current: { type: integer }
        previous: { type: integer, description: the same figure for the period of equal length before }
    PeriodFloat:
      type: object
      required: [current, previous]
      properties:
        current: { type: number, nullable: true }
        previous: { type: number, nullable: true }
    SeriesPoint:
      type: object
      required: [t, counts]
      properties:
        t: { type: string, format: date-time, description: start of the bucket }
        counts: { type: object, additionalProperties: { type: integer } }
    TermCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    ConnectionTestResult:
      type: object
      required: [ok, status, execution_id]
      properties:
        ok: { type: boolean }
        status: { type: string }
        execution_id: { type: string }
        output: {}
        error: { type: string }
