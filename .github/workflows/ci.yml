name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: golangci/golangci-lint-action@v6
        with: { version: v1.64.8 }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image

  integration:
    runs-on: ubuntu-latest
    needs: [unit, image]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: OpenSearch kernel setting
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start stack (Step 1 exit gate)
        run: make up
      - run: make test-integration
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=200
      - run: make clean
        if: always()
