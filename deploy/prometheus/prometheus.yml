global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: soar
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080", "ingest:8081", "processor:8082", "collector:8083", "orchestrator:8084", "worker:8085", "scheduler:8086"]
  - job_name: nats
    metrics_path: /varz
    static_configs: [{ targets: ["nats:8222"] }]
