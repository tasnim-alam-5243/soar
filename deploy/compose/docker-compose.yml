# Dev stack (Steps 1-2). Keycloak, MinIO, runner and web are added by the steps that need them.
# Security plugin is OFF for OpenSearch in dev. Production enables TLS + a least-privilege user (Step 9/15).
name: soar

x-soar: &soar
  image: soar:dev          # built by `make image` (the Makefile does this before `up`)
  pull_policy: never
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    SOAR_OS_URLS: http://opensearch:9200
    SOAR_NATS_URL: nats://nats:4222
    SOAR_PARTITIONS: "${SOAR_PARTITIONS:-8}"
    SOAR_LOG_LEVEL: "${SOAR_LOG_LEVEL:-info}"
    # Step 2. One dev node cannot hold replicas (cluster would stay yellow); production sets both to 1.
    SOAR_OS_STATE_REPLICAS: "${SOAR_OS_STATE_REPLICAS:-0}"
    SOAR_OS_TS_REPLICAS: "${SOAR_OS_TS_REPLICAS:-0}"
  depends_on:
    opensearch: { condition: service_healthy }
    nats: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OS_HEAP:-1g} -Xmx${OS_HEAP:-1g}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch: { condition: service_healthy }

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../nats/nats.conf:/etc/nats/nats.conf:ro,z   # ":z" relabels for SELinux (Rocky Linux)
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *soar
    restart: "no"
    command: ["migrate"]
    volumes:
      # Edit config/retention.yaml, then `make migrate` applies it without rebuilding the image.
      # (The same file is also baked into the image at /etc/soar/retention.yaml.)
      - ../../config/retention.yaml:/etc/soar/retention.yaml:ro,z
    depends_on:
      opensearch: { condition: service_healthy }
      nats: { condition: service_healthy }

  api:
    <<: *soar
    command: ["api"]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck: &hc
      test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ingest:
    <<: *soar
    command: ["ingest"]
    ports: ["127.0.0.1:8081:8081"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8081/readyz"] }

  processor:
    <<: *soar
    command: ["processor"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8082/readyz"] }

  collector:
    <<: *soar
    command: ["collector"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8083/readyz"] }

  orchestrator:
    <<: *soar
    command: ["orchestrator"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8084/readyz"] }

  worker:
    <<: *soar
    command: ["worker"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8085/readyz"] }

  scheduler:
    <<: *soar
    command: ["scheduler"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8086/readyz"] }

volumes:
  opensearch-data:
  nats-data:
