# Development stack: every role of the platform plus OpenSearch, NATS, S3 object storage (RustFS), Keycloak, the
# sandboxed Python runner and the web UI. All ports bind to 127.0.0.1.
# DEVELOPMENT DEFAULTS ARE PUBLIC (master key, bootstrap API key, Keycloak users): change them in
# deploy/compose/.env before this stack holds real data. Production: deploy/prod (Step 15).
# The OpenSearch security plugin is OFF here; production enables TLS and a least-privilege user.
name: soar

x-soar: &soar
  image: soar:dev          # built by `make image` (the Makefile does this before `up`)
  pull_policy: never
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &soar-env
    SOAR_OS_URLS: http://opensearch:9200
    SOAR_NATS_URL: nats://nats:4222
    SOAR_PARTITIONS: "${SOAR_PARTITIONS:-8}"
    SOAR_LOG_LEVEL: "${SOAR_LOG_LEVEL:-info}"
    # Step 2. One dev node cannot hold replicas (cluster would stay yellow); production sets both to 1.
    SOAR_OS_STATE_REPLICAS: "${SOAR_OS_STATE_REPLICAS:-0}"
    SOAR_OS_TS_REPLICAS: "${SOAR_OS_TS_REPLICAS:-0}"
    # Step 5. JetStream reserves max_bytes against free disk, so the dev default is modest (production: 20 GiB, spec 8.2).
    SOAR_EVENTS_MAX_BYTES: "${SOAR_EVENTS_MAX_BYTES:-2147483648}"
    SOAR_NATS_REPLICAS: "${SOAR_NATS_REPLICAS:-1}"
    SOAR_PROCESSOR_WORKERS: "${SOAR_PROCESSOR_WORKERS:-2}"
    # Step 7: S3 object storage (the "s3" service below) for payloads over 64 KB, raw bodies and case evidence.
    SOAR_BLOB_ENDPOINT: http://s3:9000
    SOAR_BLOB_ACCESS_KEY: "${S3_ACCESS_KEY:-soar-s3}"
    SOAR_BLOB_SECRET_KEY: "${S3_SECRET_KEY:-soar-s3-dev-password}"
    SOAR_POLICY_FILE: /etc/soar/policy.yaml
    # Step 9: secret encryption master key (32 bytes, base64). Generate: openssl rand -base64 32
    SOAR_MASTER_KEY_ID: "${SOAR_MASTER_KEY_ID:-k1}"
    SOAR_MASTER_KEY: "${SOAR_MASTER_KEY:-ZGV2LW9ubHktbWFzdGVyLWtleS1jaGFuZ2UtbWUhISE=}"
  volumes:
    - ../../config/policy.yaml:/etc/soar/policy.yaml:ro,z
  depends_on:
    opensearch: { condition: service_healthy }
    nats: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OS_HEAP:-1g} -Xmx${OS_HEAP:-1g}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch: { condition: service_healthy }

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    # NATS_CONF picks the durability profile: nats.conf (fsync every write, the spec default for one node)
    # or nats-relaxed.conf (fsync every 200 ms). See `make nats-relaxed` and the README for the measured difference.
    command: ["-c", "/etc/nats/${NATS_CONF:-nats.conf}"]
    volumes:
      - ../nats:/etc/nats:ro,z   # ":z" relabels for SELinux (Rocky Linux)
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *soar
    restart: "no"
    command: ["migrate"]
    volumes:
      # Edit config/retention.yaml, then `make migrate` applies it without rebuilding the image.
      # (The same file is also baked into the image at /etc/soar/retention.yaml.)
      - ../../config/retention.yaml:/etc/soar/retention.yaml:ro,z
    depends_on:
      opensearch: { condition: service_healthy }
      nats: { condition: service_healthy }
      s3: { condition: service_healthy }

  # Installs the built-in source packs (Wazuh mapping, filter set, sources, lists). Idempotent.
  # Set SOAR_WAZUH_INDEXER_URL (+ user/password for the collector) in .env to enable the pull source.
  seed:
    <<: *soar
    restart: "no"
    command: ["seed"]
    environment:
      <<: *soar-env
      SOAR_WAZUH_INDEXER_URL: "${SOAR_WAZUH_INDEXER_URL:-}"
      SOAR_WAZUH_INDEXER_CA_FILE: "${SOAR_WAZUH_INDEXER_CA_FILE:-}"
      SOAR_WAZUH_INDEXER_INSECURE: "${SOAR_WAZUH_INDEXER_INSECURE:-false}"

  api:
    <<: *soar
    command: ["api"]
    environment:
      <<: *soar-env
      # Keycloak: tokens carry the issuer the browser sees; keys are fetched over the compose network.
      SOAR_OIDC_ISSUER: "${SOAR_OIDC_ISSUER:-http://localhost:8180/realms/soar}"
      SOAR_OIDC_AUDIENCE: soar-api
      SOAR_OIDC_JWKS_URL: "${SOAR_OIDC_JWKS_URL:-http://keycloak:8080/realms/soar/protocol/openid-connect/certs}"
      # First admin API key (CLI, scripts, tests). CHANGE IT: this default is public.
      SOAR_BOOTSTRAP_API_KEY: "${SOAR_BOOTSTRAP_API_KEY:-soar_dev-bootstrap-key-change-me-0123456789abcdef}"
      SOAR_AUTH_DISABLED: "${SOAR_AUTH_DISABLED:-false}"
    ports: ["127.0.0.1:8080:8080"]
    healthcheck: &hc
      test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ingest:
    <<: *soar
    command: ["ingest"]
    environment:
      <<: *soar-env
      # Token the Wazuh Integrator sends (api_key). CHANGE IT: this default is public.
      SOAR_SOURCE_TOKEN_WAZUH_PROD: "${SOAR_SOURCE_TOKEN_WAZUH_PROD:-dev-wazuh-token-change-me}"
    depends_on:
      opensearch: { condition: service_healthy }
      nats: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8081:8081"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8081/readyz"] }

  processor:
    <<: *soar
    command: ["processor"]
    depends_on:
      opensearch: { condition: service_healthy }
      nats: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8082/readyz"] }

  collector:
    <<: *soar
    command: ["collector"]
    environment:
      <<: *soar-env
      SOAR_WAZUH_INDEXER_USER: "${SOAR_WAZUH_INDEXER_USER:-}"
      SOAR_WAZUH_INDEXER_PASSWORD: "${SOAR_WAZUH_INDEXER_PASSWORD:-}"
    depends_on:
      opensearch: { condition: service_healthy }
      nats: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8083/readyz"] }

  orchestrator:
    <<: *soar
    command: ["orchestrator"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8084/readyz"] }

  worker:
    <<: *soar
    command: ["worker"]
    environment:
      <<: *soar-env
      SOAR_RUNNER_ADDR: runner:50051
      SOAR_WORKER_CONCURRENCY: "${SOAR_WORKER_CONCURRENCY:-16}"
    networks: [default, runner]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8085/readyz"] }

  scheduler:
    <<: *soar
    command: ["scheduler"]
    healthcheck: { <<: *hc, test: ["CMD", "/soar", "healthcheck", "http://127.0.0.1:8086/readyz"] }

  # Object storage (spec 5.1). Any S3-compatible store works (path-style requests, SigV4).
  # The dev stack runs RustFS (Apache-2.0), a MinIO-compatible server: MinIO no longer publishes
  # container images (minio/minio and minio/mc are gone from Docker Hub and Quay).
  # Console: http://localhost:9001 with the S3 keys below. Server logs are files under /logs in the container.
  s3:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    cap_drop: [ALL]               # the image runs as uid 10001 on unprivileged ports
    security_opt: ["no-new-privileges:true"]
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:-soar-s3}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:-soar-s3-dev-password}"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes: [s3-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # OIDC provider (spec 13). The dev realm (deploy/keycloak/realm.json) has users admin, engineer,
  # analyst and viewer whose password equals the user name. DEVELOPMENT ONLY.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-kcadmin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-kcadmin-dev-password}"
      KC_HOSTNAME: "${KC_HOSTNAME:-http://localhost:8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro,z
    ports: ["127.0.0.1:8180:8080"]

  # Sandboxed Python runner (spec 10): non-root, read-only filesystem, no capabilities, CPU and
  # memory limits. It reaches the worker over an internal network. Integrations need egress to
  # their products (IRIS, Microsoft Graph); in production route it through an allowlisting proxy
  # (HTTPS_PROXY) or a Kubernetes NetworkPolicy instead of the open "egress" network used here.
  runner:
    image: soar-runner:dev
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SOAR_RUNNER_WORKERS: "16"
      HTTPS_PROXY: "${RUNNER_HTTPS_PROXY:-}"
    networks: [runner, egress]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web UI (spec 12), served by nginx, which also proxies /api to the api service.
  web:
    image: soar-web:dev
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      api: { condition: service_healthy }

  # Optional monitoring: docker compose --profile monitoring up -d  (Prometheus on 127.0.0.1:9090)
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ../prometheus:/etc/prometheus:ro,z
    ports: ["127.0.0.1:9090:9090"]

networks:
  default: {}
  runner: { internal: true }
  egress: {}

volumes:
  opensearch-data:
  nats-data:
  s3-data:
