# Dev NATS: single node, JetStream on. Production uses a 3-node cluster with replicas 3 (spec 8.1).
server_name: soar-dev
port: 4222
http: 8222

jetstream {
  store_dir: /data
  # Single-node durability (spec 8.2): fsync every write so an acked message survives power loss.
  # Costs throughput; measure it in the Step 5 load test and relax only with evidence.
  sync_interval: always
}
