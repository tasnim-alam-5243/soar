# Dev NATS with batched fsync. Same as nats.conf except JetStream syncs to disk every 200 ms
# instead of after every write.
#
# Why: with `sync_interval: always` every publish AND every acknowledgement costs an fsync. Measured on one
# machine this limited publishing to ~1,100 events/s, and the processor to roughly half of that, so the
# 1,000 events/s peak and the 2,000 events/s burst of the spec cannot be met on an ordinary disk.
#
# Trade-off: a message that was acknowledged less than 200 ms before a power loss, kernel panic or VM crash can
# be lost. A restart of the NATS process or container loses nothing (the data is already in the OS page cache).
# Production runs a 3-node cluster with replicas 3 (spec 8.1): a message is acknowledged only after a quorum of
# nodes has it, which is the real protection, so this setting is appropriate there too.
server_name: soar-dev
port: 4222
http: 8222

jetstream {
  store_dir: /data
  sync_interval: 200ms
}
