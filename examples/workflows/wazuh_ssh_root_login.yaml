# Wazuh: successful SSH or PAM login as root from a remote address (rule 5715 / 5501).
# Opens a case, records the source IP, asks an analyst, then blocks the IP with Wazuh
# active response on the agent. Import: POST /api/v1/workflows {"name": "...", "definition": <this>}
triggers:
  - type: alert
    match: 'alert.source_id in ["wazuh-prod", "wazuh-pull"] && alert.ext.rule.id in ["5715", "5501"] && alert.observables.exists(o, o.type == "user" && o.value == "root")'
inputs:
  - name: src_ip
    from: 'alert.observables.exists(o, o.type == "ip") ? alert.observables.filter(o, o.type == "ip")[0].value : ""'
  - name: agent_id
    from: 'alert.ext.agent.id'
nodes:
  - id: open_case
    action: case.create
    params:
      title: '"Root login on " + alert.ext.agent.name + (inputs.src_ip != "" ? " from " + inputs.src_ip : "")'
      severity: 4
      tags: '["wazuh", "root-login"]'
  - id: has_ip
    type: branch
    cases:
      - when: 'inputs.src_ip != "" && inputs.agent_id != "000"'
        next: [record_ip]
    default: [done]
  - id: record_ip
    action: observable.add
    params: { type: ip, value: 'inputs.src_ip', case_id: 'steps.open_case.output.case_id' }
  - id: ask
    type: approval
    message: '"Block " + inputs.src_ip + " on agent " + inputs.agent_id + "? Case " + steps.open_case.output.case_id'
    timeout: 4h
    on_reject: [note_rejected]
  - id: block
    action: wazuh.active_response.run
    params: { agent_ids: '[inputs.agent_id]', command: firewall-drop, srcip: 'inputs.src_ip' }
    retry: { max_attempts: 3, initial: 5s }
    on_error: [note_failed]
  - id: note_rejected
    action: case.update
    params: { case_id: 'steps.open_case.output.case_id', summary: '"Block declined by " + steps.ask.output.decided_by' }
  - id: note_failed
    action: case.update
    params: { case_id: 'steps.open_case.output.case_id', summary: '"Automatic block failed: " + steps.block.error.message' }
  - { id: done, type: end }
edges:
  - open_case -> has_ip
  - record_ip -> ask
  - ask -> block
